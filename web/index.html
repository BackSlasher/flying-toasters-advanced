<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flying Toasters!</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The classic After Dark Flying Toasters screensaver, flapping in your browser.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flying Toasters!">
<meta property="og:title" content="Flying Toasters!">
<meta property="og:description" content="The classic After Dark Flying Toasters screensaver, flapping in your browser.">
<meta property="og:url" content="https://backslasher.github.io/flying-toasters-reverse-engineered/">
<meta property="og:image" content="https://backslasher.github.io/flying-toasters-reverse-engineered/og-banner.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Flying Toasters!">
<meta name="twitter:description" content="The classic After Dark Flying Toasters screensaver, flapping in your browser.">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage-wrap">
  <canvas id="stage" width="640" height="480"></canvas>
</div>
<div id="topbar">
  <button id="menu-btn" title="Settings">☰ menu</button>
  <button id="music-btn" title="Music">🎵 music</button>
  <button id="sfx-btn" title="Sound effects">🔈 sfx</button>
  <button id="karaoke-btn" title="Karaoke lyrics">🎤 karaoke</button>
</div>
<div id="identify" class="hidden"><span id="id-text"></span><button id="id-copy" class="hidden">copy</button><button id="id-close" title="close">✕</button></div>
<div id="panel" class="hidden">
  <h1>Flying Toasters!</h1>
  <label>Density: <span id="objects-label">Air Wing</span>
    <input type="range" id="objects" min="0" max="3" step="1" value="2" class="slider">
  </label>
  <label>Toasters:
    <select id="toasters">
      <option value="0" selected>Adults</option>
      <option value="1">Babies</option>
      <option value="2">Random</option>
    </select>
  </label>
  <div class="row">
    <button id="intro-btn">Play intro</button>
    <button id="debug-btn">Debug…</button>
    <button id="close-btn">Close</button>
  </div>
  <p class="hint">Press <kbd>Esc</kbd> or click to toggle this panel.</p>
  <p class="meta-row">
    <a href="catalog.html" id="catalog-link">Cast catalog</a>
    <span id="build-box"><a id="gh-link" href="https://github.com/BackSlasher/flying-toasters-reverse-engineered"
        target="_blank" rel="noopener" title="Source on GitHub"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a><span
      id="build" title="build">__BUILD__</span></span></p>
</div>
<div id="loading">Loading toasters…</div>
<script src="player.js"></script>
</body>
</html>
