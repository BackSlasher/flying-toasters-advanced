<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flying Toasters!</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage-wrap">
  <canvas id="stage" width="640" height="480"></canvas>
</div>
<div id="topbar">
  <button id="menu-btn" title="Settings">☰ menu</button>
  <button id="music-btn" title="Music">🎵 music</button>
  <button id="sfx-btn" title="Sound effects">🔈 sfx</button>
  <button id="karaoke-btn" title="Karaoke lyrics">🎤 karaoke</button>
</div>
<div id="identify" class="hidden"><span id="id-text"></span><button id="id-copy" class="hidden">copy</button><button id="id-close" title="close">✕</button></div>
<div id="panel" class="hidden">
  <h1>Flying Toasters!</h1>
  <label>Density: <span id="objects-label">Air Wing</span>
    <input type="range" id="objects" min="0" max="3" step="1" value="2" class="slider">
  </label>
  <label>Toasters:
    <select id="toasters">
      <option value="0" selected>Adults</option>
      <option value="1">Babies</option>
      <option value="2">Random</option>
    </select>
  </label>
  <div class="row">
    <button id="intro-btn">Play intro</button>
    <button id="debug-btn">Debug…</button>
    <button id="close-btn">Close</button>
  </div>
  <p class="hint">Press <kbd>Esc</kbd> or click to toggle this panel.</p>
</div>
<div id="loading">Loading toasters…</div>
<script src="player.js"></script>
</body>
</html>
